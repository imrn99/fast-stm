[package]
name = "benches"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true
description.workspace = true
authors = ["Isaie Muron <github@imrn.fr>"]

[features]
default = ["fast-stm"]
fast-stm = ["dep:fast-stm", "fast-stm/bench"]
sserp-stm = ["dep:sserp-stm", "sserp-stm/bench"]

[dependencies]
fast-stm = { workspace = true, optional = true }
sserp-stm = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "read-time"
path = "benches/read.rs"
harness = false

[[bench]]
name = "write-time"
path = "benches/write.rs"
harness = false

[[bench]]
name = "tvar-struct"
path = "benches/tvars.rs"
harness = false

[[bench]]
name = "transaction-struct"
path = "benches/transactions.rs"
harness = false
