name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_crates:
    name: Build crate for ${{ matrix.os }} (${{ matrix.feats }})
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        feats: [ --all-features, --no-default-features ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets -p fast-stm ${{ matrix.feats }}
  build_benches:
    name: Build benchmarks (${{ matrix.feats }})
    strategy:
      matrix:
        feats: [ --all-features, --no-default-features ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets -p benches ${{ matrix.feats }}
