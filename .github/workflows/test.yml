name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check Format
        run: cargo fmt -- --check
  clippy:
    name: Crate clippy lints (${{ matrix.feats }})
    strategy:
      matrix:
        feats: [ --all-features, --no-default-features ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy -p fast-stm --all-targets ${{ matrix.feats }}
  tests:
    name: Crate tests (${{ matrix.feats }})
    strategy:
      matrix:
        feats: [ --all-features, --no-default-features ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Tests
        run: cargo test -p fast-stm --all-targets ${{ matrix.feats }}
